[tool.ruff]
line-length = 100
target-version = "py312"
respect-gitignore = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "SIM"]
ignore = [
  "E501",
  "SIM114",
  "SIM115",
  "SIM117",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"conftest.py" = ["E402"]
"api/endpoints.py" = ["SIM105"]
"seed/popular_banco.py" = ["N806"]
"core/memoria.py" = ["N818"]
